name: qc-webtoon

services:
  server:
    image: qc-webtoon-server:local
    build:
      context: .
      target: server
    env_file:
      - path: ./apps/server/.env
        format: raw
    environment:
      NODE_ENV: production
      PORT: "5000"
      # The parked feature does not receive its local API credential.
      GEMINI_API_KEY: ""
      # Host paths (especially Windows paths) are invalid inside Linux containers.
      # scripts/docker.mjs adds the read-only mount when a file is configured.
      GOOGLE_SERVICE_ACCOUNT_FILE: ""
    expose:
      - "5000"
    init: true
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  client:
    image: qc-webtoon-client:local
    build:
      context: .
      target: client
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
